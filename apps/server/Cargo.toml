# The server, and the crates only its tests use
[workspace]
members = ["test-macros"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The crates only serve the server's binaries and tests, not other crates
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# A long function can be the clearest way to say one thing
too_many_lines = "allow"
# A module with children lives in `name.rs` next to `name/`
mod_module_files = "deny"
# `expect` says which invariant broke. Tests may unwrap
unwrap_used = "warn"

[package]
name = "watch_club"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A self-hosted media server for small private groups"
license = "MIT"
publish = false
default-run = "watch_club"

[features]
# Builds the `seed` binary, which only development needs
dev-seed = []

[[bin]]
name = "seed"
required-features = ["dev-seed"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
croner = { version = "4.0.3", default-features = false, features = ["jiff"] }
# `catch_unwind`, which turns a panicking job into a failed attempt
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
jiff = "0.2.43"
jiff-sqlx = { version = "0.2.2", features = ["postgres"] }
opentelemetry = "0.33.1"
# `experimental_span_attributes` copies the fields of the request's or job's span onto its logs
opentelemetry-appender-tracing = { version = "0.33.1", features = ["experimental_span_attributes"] }
opentelemetry-instrumentation-tower = { version = "0.19.0", features = ["axum"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "metrics", "logs", "internal-logs"] }
opentelemetry-semantic-conventions = { version = "0.33.1", features = ["semconv_experimental"] }
opentelemetry_sdk = "0.33.1"
password-auth = "2.0.0"
# Calls TMDB. `query` builds query strings, `gzip` shrinks TMDB's large answers
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "query", "gzip"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
secrecy = { version = "0.10.3", features = ["serde"] }
sentry = { version = "0.49.6", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls", "tracing", "tower-http"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "macros", "migrate", "sqlx-toml"] }
# Traces each query, and reports the pool in metrics, with OpenTelemetry's database conventions. Its
# minor versions follow OpenTelemetry's: with two copies of OpenTelemetry, its spans silently vanish
sqlx-otel = { version = "0.6.0", features = ["postgres", "runtime-tokio"] }
thiserror = "2.0.21"
# The `Duration` cookies take
time = { version = "0.3.55", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "net", "signal", "time"] }
tokio-util = "0.7.20"
# `catch-panic` answers a panicking handler with a 500, as any internal error
tower-http = { version = "0.7.1", features = ["catch-panic", "trace"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["uuid"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.2", features = ["serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
watch_club_test_macros = { path = "test-macros" }
# Stands in for TMDB
wiremock = "0.6.5"

[lints]
workspace = true

# Speed up compilation while keeping file and line numbers in error backtraces.
[profile.dev]
debug = "line-tables-only"
# Packs that information into a .dSYM bundle per binary. Since Rust 1.88, the default on macOS
# leaves a new set of object files in target/ on every build and never deletes them, which slows
# builds and worktree copies. Remove once rust-lang/rust#161824 is fixed in the Rust version we use.
split-debuginfo = "packed"

# Speed up compilation by skipping debug information for dependencies.
[profile.dev.package."*"]
debug = false
