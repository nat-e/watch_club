# The Rust types the SQLx macros give columns, so queries don't repeat them with `AS "id: UserId"`.
# Table overrides only apply to output columns that come straight from a table. Paths start with
# `::watch_club` to work in the library, the binaries and the tests alike.

[macros.type-overrides]
# SQLx has no Jiff support, see jiff-sqlx. Also checks the parameters bound to `timestamptz` and
# `date`.
'TIMESTAMPTZ' = "jiff_sqlx::Timestamp"
'DATE' = "jiff_sqlx::Date"
'job_state' = "::watch_club::jobs::JobState"
'locale' = "::watch_club::domain::accounts::Locale"
'content_type' = "::watch_club::domain::contents::ContentType"
'metadata_provider' = "::watch_club::domain::contents::MetadataProvider"
'media_type' = "::watch_club::domain::contents::MediaType"
'credit_kind' = "::watch_club::domain::contents::CreditKind"
'genre' = "::watch_club::domain::contents::Genre"

[macros.table-overrides.'users']
'id' = "::watch_club::domain::accounts::UserId"
'audio_language' = "::watch_club::domain::accounts::AudioLanguage"
'subtitle_language' = "::watch_club::domain::accounts::TrackLanguage"
'languages_without_subtitles' = "Vec<::watch_club::domain::accounts::TrackLanguage>"

[macros.table-overrides.'sessions']
'user_id' = "::watch_club::domain::accounts::UserId"

[macros.table-overrides.'jobs']
'id' = "::watch_club::jobs::JobId"
'queue' = "::watch_club::jobs::Queue"

[macros.table-overrides.'contents']
'id' = "::watch_club::domain::contents::ContentId"
'genres' = "Vec<::watch_club::domain::contents::Genre>"
'backdrop' = "::sqlx::types::Json<::watch_club::domain::contents::Image>"
'external_ids' = "::sqlx::types::Json<::watch_club::domain::contents::ExternalIds>"

[macros.table-overrides.'content_localizations']
'content_id' = "::watch_club::domain::contents::ContentId"
'poster' = "::sqlx::types::Json<::watch_club::domain::contents::Image>"

[macros.table-overrides.'content_credits']
'content_id' = "::watch_club::domain::contents::ContentId"
'photo' = "::sqlx::types::Json<::watch_club::domain::contents::Image>"
'external_ids' = "::sqlx::types::Json<::watch_club::domain::contents::ExternalIds>"

[macros.table-overrides.'media']
'id' = "::watch_club::domain::contents::MediaId"
'content_id' = "::watch_club::domain::contents::ContentId"
'image' = "::sqlx::types::Json<::watch_club::domain::contents::Image>"

[macros.table-overrides.'media_localizations']
'media_id' = "::watch_club::domain::contents::MediaId"
