name: Renovate

# Renovate opens its weekly PRs on Monday (see renovate.json). The extra runs
# on Monday merge the ones that passed CI and rebase the others. The daily run
# picks up security fixes and Dependency Dashboard requests.
on:
  schedule:
    - cron: "17 */3 * * 1"
    - cron: "17 6 * * 0,2-6"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  renovate:
    runs-on: ubuntu-24.04
    env:
      # renovate: datasource=github-releases depName=renovatebot/renovate
      RENOVATE_VERSION: 44.181.7
    steps:
      - name: Get a token from the GitHub App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          # What Renovate needs: https://docs.renovatebot.com/modules/platform/github/#running-as-a-github-app
          permission-administration: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ env.RENOVATE_VERSION }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
