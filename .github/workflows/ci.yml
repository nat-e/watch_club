name: CI

on: # zizmor: ignore[cache-poisoning] only checks use these caches; the published image is built by docker/github-builder, which signs its own cache
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

# A new push to a pull request cancels its previous run. Runs on main and on
# tags queue up instead, so every published image comes from a finished run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks and tests
    # Matches the precompiled Erlang that mise.lock points to
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Erlang, Elixir, Biome and ffmpeg from mise.lock
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Cache dependencies and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mise.lock') }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ hashFiles('mise.lock') }}-

      - run: mix deps.get
      - run: mix ci

  workflows:
    name: Workflow security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Code scanning results need the repo to be public
          advanced-security: false

  image:
    name: Image smoke test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/watch_club:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: final
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=smoke-test
          cache-to: type=gha,scope=smoke-test,mode=max

      # Starts the image the way self-hosters do, with docker-compose.yml and
      # .env.example. The image runs migrations on start, and --wait returns
      # once its healthcheck passes.
      - name: Start the image with Postgres
        run: |
          sed 's/^WATCH_CLUB_VERSION=.*/WATCH_CLUB_VERSION=ci/' .env.example > .env
          docker compose up --detach --wait --wait-timeout 180

      - name: Check that the app serves pages
        run: curl --fail --silent --show-error --location --output /dev/null http://localhost:4000/

      - name: Show the app logs
        if: failure()
        run: docker compose logs

      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # Report only: findings don't block the build
          exit-code: "0"

  publish:
    name: Publish image
    needs: [checks, image]
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
      packages: write
    # Builds each platform on its own native runner, then pushes one
    # multi-platform image with provenance attestations.
    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1.18.1
    with:
      output: image
      push: true
      target: final
      # arm64 runners are only free for public repositories
      platforms: ${{ github.event.repository.private && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
      # Signing writes to Sigstore's public log, so it waits for the repo to be public
      sign: ${{ github.event.repository.private && 'false' || 'auto' }}
      cache: true
      cache-mode: max
      set-meta-labels: true
      meta-images: ghcr.io/${{ github.repository_owner }}/watch_club
      # A release casts with the release Cast app, main with the edge one
      build-args: ${{ startsWith(github.ref, 'refs/tags/v') && 'CAST_RECEIVER=release' || '' }}
      # main publishes `edge` and the commit SHA. A release tag (v1.2.3)
      # publishes `1.2.3`, `1.2` and `latest`.
      meta-tags: |
        type=edge,branch=main
        type=sha,format=long,prefix=
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  vulnerability-report:
    name: Vulnerability report
    needs: publish
    # Code scanning results need the repo to be public
    if: github.event_name == 'push' && !github.event.repository.private
    runs-on: ubuntu-24.04
    permissions:
      packages: read
      security-events: write
    steps:
      - name: Scan the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/watch_club:${{ github.sha }}
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Send the results to the Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
