name: CI

on: # zizmor: ignore[cache-poisoning] only checks use these caches; the published image is built by docker/github-builder, which signs its own cache
  pull_request:
  push:
    branches: [rust]

permissions: {}

# A new push to a pull request cancels its previous run. Runs on rust queue up
# instead, so every published image comes from a finished run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks and tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/watch_club
      # The SQLx macros check queries against .sqlx, which fails when it's out of date
      SQLX_OFFLINE: "true"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watch_club
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust, Node, pnpm and turbo from mise.lock
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # The checks don't need the dev tools, and sqlx-cli builds from source
          install_args: rust node pnpm npm:turbo

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/server
          # Pull requests reuse the cache of rust rather than each saving their own
          save-if: ${{ github.ref == 'refs/heads/rust' }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  workflows:
    name: Workflow security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Code scanning results need the repo to be public
          advanced-security: false

  image:
    name: Image smoke test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/watch_club:ci
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watch_club
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=smoke-test
          cache-to: type=gha,scope=smoke-test,mode=max

      # The server runs the migrations on start
      - name: Start the image
        run: >-
          docker run --detach --name watch_club --network host
          --env DATABASE_URL=postgres://postgres:postgres@localhost:5432/watch_club
          --env PORT=4000
          "$IMAGE"

      - name: Check that the app serves pages
        run: >-
          curl --fail --silent --show-error --output /dev/null
          --retry 60 --retry-delay 2 --retry-all-errors
          http://localhost:4000/

      - name: Show the app logs
        if: failure()
        run: docker logs watch_club

      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # Report only: findings don't block the build
          exit-code: "0"

  publish:
    name: Publish image
    needs: [checks, image]
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
      packages: write
    # Builds each platform on its own native runner, then pushes one
    # multi-platform image with provenance attestations.
    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1.18.1
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      sign: auto
      cache: true
      cache-mode: max
      set-meta-labels: true
      meta-images: ghcr.io/${{ github.repository_owner }}/watch_club
      # Only the `rust` tag: main publishes the Phoenix app's `edge`, `latest`
      # and version tags, and its commit SHAs.
      meta-tags: |
        type=raw,value=rust
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
