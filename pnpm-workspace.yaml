packages:
  - apps/*
  - packages/*

# Runs the root's postinstall, which generates the harness files, even when the dependencies haven't
# changed, as after a merge
optimisticRepeatInstall: false

# Only installs versions published at least a week ago (in minutes), so a hijacked release has
# time to be found and pulled before it reaches us
minimumReleaseAge: 10080
# Except Expo's own packages: each Expo SDK patch expects the latest patches of its modules
minimumReleaseAgeExclude:
  - expo
  - expo-*
  - "@expo/*"
  - babel-preset-expo
# Refuses a version published with weaker proof of where it comes from than the versions before it,
# as when a stolen token publishes it outside the package's usual pipeline
trustPolicy: no-downgrade

# Versions shared by the web and mobile apps. Expo pins React per SDK release: upgrade React here
# with Expo, as two React versions in one app break it
catalog:
  # An alpha: pinned, as each one can break the API
  "@tanstack/react-form": 2.0.0-alpha.3
  "@tanstack/react-query": ^5.104.1
  "@types/node": ^26.6.0
  "@types/react": ~19.3.0
  "@types/react-dom": ~19.3.0
  # The apps and packages/core must share one copy of each, or the apps can't find the translations
  i18next: ^27.0.1
  react-i18next: ^18.0.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: ^4.3.5
  # TypeScript 7 checks the types. Hey API's generator needs TypeScript 6's JavaScript API, which 7
  # lacks, so packages/api installs 6 as `typescript` and 7 as `@typescript/native`
  typescript: ^7.0.2
  "@typescript/native": npm:typescript@^7.0.2
  vite: ^8.3.6
  vitest: ^5.0.3

allowBuilds:
  # The Sentry SDK's command line tool, which uploads the mobile app's source maps: its install
  # script only downloads the binary its optional dependencies already install for this platform
  "@sentry/cli": false
  # i18next-cli's parser: its install script only checks that the binary for this platform loads
  "@swc/core": false
