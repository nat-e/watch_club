# The app's Postgres server, apart from the Phoenix app's
services:
  db:
    image: postgres:18.3-trixie
    environment:
      POSTGRES_PASSWORD: postgres
    # Each worktree runs its own copy, see .config/wt.toml
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
    restart: unless-stopped

volumes:
  pgdata:
