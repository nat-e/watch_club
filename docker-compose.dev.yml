# The services that the worktrees share in development, apart from the Phoenix app's: Postgres,
# where each worktree has its own database, and a Radarr, Sonarr and Sportarr filled with the dev
# catalog's clips. Start them with `pnpm dev:shared`, see scripts/dev_shared.sh
name: watch_club_rs

services:
  db:
    image: postgres:18.3-trixie
    # Room for the dev servers and test runs of every worktree
    command: postgres -c max_connections=500
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - 127.0.0.1:5433:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
    restart: unless-stopped

  # They have no indexer or download client, so they never download anything. The clips are in the
  # primary worktree's tmp/catalog
  radarr:
    image: lscr.io/linuxserver/radarr:6.2.1
    environment:
      # No sign-in in the browser. The API still needs the key
      RADARR__AUTH__METHOD: External
    ports:
      - 127.0.0.1:4103:7878
    volumes:
      - ./tmp/catalog:/media
      - radarr:/config
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    environment:
      SONARR__AUTH__METHOD: External
    ports:
      - 127.0.0.1:4104:8989
    volumes:
      - ./tmp/catalog:/media
      - sonarr:/config
    restart: unless-stopped

  sportarr:
    image: sportarr/sportarr:4.1.12.1122
    ports:
      - 127.0.0.1:4105:1867
    volumes:
      - ./tmp/catalog:/media
      - sportarr:/config
    restart: unless-stopped

volumes:
  pgdata:
  radarr:
  sonarr:
  sportarr:
