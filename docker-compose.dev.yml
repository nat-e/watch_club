name: watch_club

services:
  db:
    image: postgres:18.3-trixie
    networks:
      - watch_club
    restart: unless-stopped
    # set shared memory limit when using docker compose
    shm_size: 128mb
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: watch_club_dev
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
  radarr:
    image: lscr.io/linuxserver/radarr:6.1.1
    container_name: wc-radarr
    environment:
      - TZ=Etc/UTC
    ports:
      - '7878:7878'
    volumes:
      - wc-radarr-config:/config
      - ./media:/media
    networks:
      - watch_club
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:7878/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.17
    container_name: wc-sonarr
    environment:
      - TZ=Etc/UTC
    ports:
      - '8989:8989'
    volumes:
      - wc-sonarr-config:/config
      - ./media:/media
    networks:
      - watch_club
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8989/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s


networks:
  watch_club:
    name: watch_club

volumes:
  pgdata:
  wc-radarr-config:
  wc-sonarr-config: