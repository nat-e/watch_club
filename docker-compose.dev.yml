name: watch_club

services:
  db:
    image: postgres:18.3-trixie
    container_name: wc-db
    networks:
      - watch_club
    restart: unless-stopped
    # set shared memory limit when using docker compose
    shm_size: 128mb
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: watch_club_dev
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/18/docker

  radarr:
    image: lscr.io/linuxserver/radarr:6.2.1
    container_name: wc-radarr
    networks:
      - watch_club
    environment:
      - TZ=Etc/UTC
    ports:
      - 7878:7878
    volumes:
      - wc-radarr-config:/config
      - ./media:/media
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    container_name: wc-sonarr
    networks:
      - watch_club
    ports:
      - 8989:8989
    volumes:
      - wc-sonarr-config:/config
      - ./media:/media
    restart: unless-stopped

networks:
  watch_club:
    name: watch_club

volumes:
  pgdata:
  wc-radarr-config:
  wc-sonarr-config: