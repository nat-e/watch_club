# Gives each worktree its own server and databases.
# Scripts run from the primary worktree so that they don't depend on the branch.

[[pre-start]]
copy = "wt step copy-ignored"

[[pre-start]]
setup = "{{ primary_worktree_path }}/scripts/worktree/setup.sh {{ branch | sanitize | replace('.', '-') }} {{ branch | sanitize_db }} {{ branch | hash_port }}"

# Radarr and Sonarr only accept a webhook they can reach, so this waits for the
# worktree's server in the background.
[post-start]
webhooks = "{{ primary_worktree_path }}/scripts/worktree/register_webhooks.sh {{ branch | sanitize | replace('.', '-') }} {{ branch | sanitize_db }} {{ branch | hash_port }}"

[pre-remove]
teardown = "{{ primary_worktree_path }}/scripts/worktree/teardown.sh {{ branch | sanitize | replace('.', '-') }} {{ branch | sanitize_db }} {{ branch | hash_port }}"

[post-merge]
update = "{{ primary_worktree_path }}/scripts/worktree/update_main.sh"

[list]
url = "{% if branch == 'main' %}http://localhost:4000{% else %}http://{{ branch | sanitize | replace('.', '-') }}.localhost:{{ branch | hash_port }}{% endif %}"

[aliases]
dev = "mix ecto.migrate && iex -S mix phx.server"
open ="open \"$(wt list statusline --format=json | jq -r '.items[0].dev_server.url')\""
