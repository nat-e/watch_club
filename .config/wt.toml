# Gives each worktree its own database, in the Postgres of docker-compose.dev.yml that they share,
# and its own ports.
# Scripts run from the primary worktree so that they don't depend on the branch.
# A worktree's server port is its branch's hash_port + 20000, clear of the Phoenix worktrees' ports, and
# the web app's and Expo's dev servers are on the next two ports.
# A worktree's database name keeps the end of sanitize_db, with its hash, short enough for the names
# of its test databases, see apps/server/src/testing.rs.

# Copies the files in .worktreeinclude from the primary worktree: .env and the build cache
[[pre-start]]
copy = "wt step copy-ignored"

[[pre-start]]
setup = "{{ primary_worktree_path }}/scripts/worktree/setup.sh {{ branch | sanitize | replace('.', '-') }} {{ (branch | hash_port) + 20000 }} watch_club_{{ (branch | sanitize_db)[-30:] }}"

[[pre-remove]]
teardown = "{{ primary_worktree_path }}/scripts/worktree/teardown.sh {{ branch | sanitize | replace('.', '-') }} {{ (branch | hash_port) + 20000 }} watch_club_{{ (branch | sanitize_db)[-30:] }}"

# Pulls the merged commit first, so that update_primary.sh runs as merged
[post-merge]
update = "git pull --ff-only && {{ primary_worktree_path }}/scripts/worktree/update_primary.sh"

[list]
url = "{% if branch == 'rust' %}http://localhost:4101{% else %}http://{{ branch | sanitize | replace('.', '-') }}.localhost:{{ (branch | hash_port) + 20001 }}{% endif %}"

[aliases]
# Starts the dev processes unless they run, then shows them. Quitting the view leaves them running
dev = "pnpm dev && process-compose attach"
open = "{{ primary_worktree_path }}/scripts/worktree/open.sh {{ worktree_path }}"
