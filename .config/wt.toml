# Gives each worktree its own Postgres, database and port: tests run in parallel worktrees would
# otherwise create and drop the same test databases on a shared server.
# Scripts run from the primary worktree so that they don't depend on the branch.
# A worktree's server port is its branch's hash_port + 20000, clear of the Phoenix worktrees' ports, and
# the web app's and Expo's dev servers are on the next two ports.

# Copies the files in .worktreeinclude from the primary worktree: .env and the build cache
[[pre-start]]
copy = "wt step copy-ignored"

[[pre-start]]
setup = "{{ primary_worktree_path }}/scripts/worktree/setup.sh {{ branch | sanitize | replace('.', '-') }} {{ (branch | hash_port) + 20000 }}"

[[pre-remove]]
teardown = "{{ primary_worktree_path }}/scripts/worktree/teardown.sh {{ branch | sanitize | replace('.', '-') }} {{ (branch | hash_port) + 20000 }}"

[post-merge]
update = "{{ primary_worktree_path }}/scripts/worktree/update_main.sh"

[list]
url = "{% if branch == 'main' %}http://localhost:4101{% else %}http://{{ branch | sanitize | replace('.', '-') }}.localhost:{{ (branch | hash_port) + 20001 }}{% endif %}"

[aliases]
dev = "pnpm dev"
open = "{{ primary_worktree_path }}/scripts/worktree/open.sh {{ worktree_path }}"
