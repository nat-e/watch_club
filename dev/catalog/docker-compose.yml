# The Radarr, Sonarr and Sportarr that every worktree shares, filled with the dev catalog's clips.
# Run them with scripts/catalog.sh, which mounts the clips in /media.
# They have no indexer or download client, so they never download anything.

services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.2.1
    environment:
      # No sign-in in the browser. The API still needs the key
      RADARR__AUTH__METHOD: External
    ports:
      - 127.0.0.1:4103:7878
    volumes:
      - ${CATALOG_MEDIA:?}:/media
      - radarr:/config
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    environment:
      SONARR__AUTH__METHOD: External
    ports:
      - 127.0.0.1:4104:8989
    volumes:
      - ${CATALOG_MEDIA:?}:/media
      - sonarr:/config
    restart: unless-stopped

  sportarr:
    image: sportarr/sportarr:4.1.12.1122
    ports:
      - 127.0.0.1:4105:1867
    volumes:
      - ${CATALOG_MEDIA:?}:/media
      - sportarr:/config
    restart: unless-stopped

volumes:
  radarr:
  sonarr:
  sportarr:
